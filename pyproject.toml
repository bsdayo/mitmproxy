[project]
name = "mitmproxy-addons"
version = "0.1.0"
description = "A mitmproxy distribution with bundled addons"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.5,<3",
    "httpx>=0.28,<0.29",
    "mitmproxy==12.2.3",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
